<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URSA · لوحة تحكم الأدمن</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #05201f, #0a2a28);
      padding: 20px;
    }
    .auth-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(8, 38, 36, 0.78);
      border-bottom: 1px solid rgba(77, 255, 158, 0.18);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      margin-bottom: 30px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-image {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      overflow: hidden;
    }
    .logo-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }
    .auth-actions {
      display: flex;
      gap: 12px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(8, 38, 36, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(77, 255, 158, 0.25);
    }
    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #4dff9e;
    }
    .reports-table-container {
      background: rgba(8, 38, 36, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(77, 255, 158, 0.25);
      overflow-x: auto;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 14px;
      text-align: right;
      border-bottom: 1px solid rgba(77, 255, 158, 0.2);
    }
    th {
      color: #4dbfa3;
      font-weight: 600;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-pending {
      background: rgba(255, 170, 68, 0.2);
      color: #ffaa44;
    }
    .status-approved {
      background: rgba(77, 255, 158, 0.2);
      color: #4dff9e;
    }
    .status-resolved {
      background: rgba(72, 187, 120, 0.2);
      color: #48bb78;
    }
    .status-dropdown {
      background: rgba(8, 38, 36, 0.85);
      color: white;
      border: 1px solid rgba(77, 255, 158, 0.3);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .action-btn {
      padding: 6px 12px;
      margin: 0 4px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .delete-btn {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
    }
    .delete-btn:hover {
      background: #ff6b6b;
      color: white;
    }
    .glass-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(77, 255, 158, 0.25);
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      color: var(--text-primary);
      text-decoration: none;
    }
    .glass-btn.primary {
      background: linear-gradient(135deg, #2d8f77, #1f6f5d);
      color: white;
      border: none;
    }
    .error-message {
      background: rgba(255, 107, 107, 0.15);
      border: 1px solid #ff6b6b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      color: #ff6b6b;
    }
    .empty-state {
      text-align: center;
      padding: 60px;
      color: #b4d9d4;
    }
    @media (max-width: 768px) {
      th, td {
        padding: 10px;
        font-size: 0.85rem;
      }
      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body class="dark">
  <div class="auth-topbar">
    <div class="logo-container">
      <div class="logo-image"><img src="URSA 3.png" alt="URSA Logo" /></div>
      <div class="logo">URSA</div>
    </div>
    <div class="auth-actions">
      <a href="index.html" class="glass-btn" style="text-decoration:none;">العودة للرئيسية</a>
    </div>
  </div>

  <div class="container">
    <!-- Admin Login Section -->
    <div id="adminLoginSection">
      <div class="glass-card auth-card" style="max-width: 500px; margin: 0 auto;">
        <h1 style="text-align:center; margin-bottom:16px;">
          <i class="fas fa-user-shield" style="color:var(--primary);"></i>
          تسجيل دخول الأدمن
        </h1>
        <p style="text-align:center; color:var(--text-secondary); margin-bottom:24px;">سجّل الدخول بكلمة المرور المخصصة</p>

        <div class="error-message" id="authError" style="display:none;"></div>

        <form id="adminLoginForm">
          <label for="adminPassword">كلمة المرور</label>
          <input class="glass-input" id="adminPassword" type="password" placeholder="••••••••" required />
          <button type="submit" class="glass-btn primary" style="width:100%; margin-top:16px;">تسجيل الدخول</button>
        </form>
      </div>
    </div>

    <!-- Admin Dashboard Section (hidden until login) -->
    <div id="adminDashboard" style="display: none;">
      <div class="dashboard-header">
        <h1><i class="fas fa-chart-line"></i> لوحة تحكم الأدمن</h1>
        <div class="stats-grid" style="margin-bottom: 0; width: auto; display: flex; gap: 15px;">
          <div class="stat-card" style="padding: 15px 25px;">
            <div class="stat-number" id="totalReports">0</div>
            <div>إجمالي البلاغات</div>
          </div>
          <div class="stat-card" style="padding: 15px 25px;">
            <div class="stat-number" id="pendingReports">0</div>
            <div>قيد المراجعة</div>
          </div>
          <div class="stat-card" style="padding: 15px 25px;">
            <div class="stat-number" id="resolvedReports">0</div>
            <div>تمت المعالجة</div>
          </div>
          <button id="logoutBtn" class="glass-btn" style="background: rgba(255,107,107,0.2); color:#ff6b6b;">تسجيل الخروج</button>
        </div>
      </div>

      <div class="reports-table-container">
        <h3 style="margin-bottom: 20px;"><i class="fas fa-list"></i> جميع البلاغات المقدمة</h3>
        <div id="reportsList">
          <div class="empty-state">جاري تحميل البلاغات...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin123";

    // Display reports in table
    function loadAllReports() {
      const reports = JSON.parse(localStorage.getItem('ursa_complaints') || '[]');
      const container = document.getElementById('reportsList');

      const total = reports.length;
      const pending = reports.filter(r => r.status === 'Pending').length;
      const resolved = reports.filter(r => r.status === 'Resolved' || r.status === 'Approved').length;

      document.getElementById('totalReports').textContent = total;
      document.getElementById('pendingReports').textContent = pending;
      document.getElementById('resolvedReports').textContent = resolved;

      if (reports.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><br>لا توجد بلاغات بعد</div>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>الوصف</th>
              <th>التصنيف</th>
              <th>الموقع</th>
              <th>التاريخ</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody>
      `;

      reports.reverse().forEach(report => {
        let statusClass = '';
        if (report.status === 'Pending') statusClass = 'status-pending';
        else if (report.status === 'Approved') statusClass = 'status-approved';
        else statusClass = 'status-resolved';

        html += `
          <tr>
            <td>${report.id}</td>
            <td>${report.description.substring(0, 50)}${report.description.length > 50 ? '...' : ''}</td>
            <td>${report.category}</td>
            <td>${report.location}</td>
            <td>${report.date}</td>
            <td>
              <select class="status-dropdown" data-id="${report.id}" style="background: rgba(8,38,36,0.85); color: white; border: 1px solid rgba(77,255,158,0.3); border-radius: 8px; padding: 6px 12px;">
                <option value="Pending" ${report.status === 'Pending' ? 'selected' : ''}>قيد المراجعة</option>
                <option value="Approved" ${report.status === 'Approved' ? 'selected' : ''}>تمت الموافقة</option>
                <option value="Resolved" ${report.status === 'Resolved' ? 'selected' : ''}>تمت المعالجة</option>
              </select>
              <span class="status-badge ${statusClass}" style="display: none;">${report.status}</span>
            </td>
            <td>
              <button class="action-btn delete-btn" onclick="deleteReport(${report.id})"><i class="fas fa-trash"></i> حذف</button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    // Delete report function
    function deleteReport(id) {
      if (confirm('هل أنت متأكد من حذف هذا البلاغ؟')) {
        let reports = JSON.parse(localStorage.getItem('ursa_complaints') || '[]');
        reports = reports.filter(r => r.id !== id);
        localStorage.setItem('ursa_complaints', JSON.stringify(reports));
        loadAllReports();
        alert('تم حذف البلاغ بنجاح');
      }
    }

    // Handle status change from dropdown
    document.addEventListener('change', function(e) {
      if (e.target && e.target.classList && e.target.classList.contains('status-dropdown')) {
        const reportId = parseInt(e.target.getAttribute('data-id'));
        const newStatus = e.target.value;
        
        let reports = JSON.parse(localStorage.getItem('ursa_complaints') || '[]');
        const reportIndex = reports.findIndex(r => r.id === reportId);
        
        if (reportIndex !== -1) {
          reports[reportIndex].status = newStatus;
          localStorage.setItem('ursa_complaints', JSON.stringify(reports));
          
          // Show success message
          const toast = document.createElement('div');
          toast.textContent = `✅ تم تحديث الحالة إلى ${newStatus === 'Pending' ? 'قيد المراجعة' : newStatus === 'Approved' ? 'تمت الموافقة' : 'تمت المعالجة'}`;
          toast.style.position = 'fixed';
          toast.style.bottom = '20px';
          toast.style.right = '20px';
          toast.style.background = '#4dff9e';
          toast.style.color = '#05201f';
          toast.style.padding = '12px 24px';
          toast.style.borderRadius = '8px';
          toast.style.zIndex = '9999';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 3000);
          
          // Update the status badge in the same row
          const row = e.target.closest('tr');
          const statusBadge = row.querySelector('.status-badge');
          if (statusBadge) {
            let statusClass = '';
            if (newStatus === 'Pending') statusClass = 'status-pending';
            else if (newStatus === 'Approved') statusClass = 'status-approved';
            else statusClass = 'status-resolved';
            
            statusBadge.className = `status-badge ${statusClass}`;
            statusBadge.textContent = newStatus;
          }
          
          // Update statistics
          const reports = JSON.parse(localStorage.getItem('ursa_complaints') || '[]');
          const total = reports.length;
          const pending = reports.filter(r => r.status === 'Pending').length;
          const resolved = reports.filter(r => r.status === 'Resolved' || r.status === 'Approved').length;
          document.getElementById('totalReports').textContent = total;
          document.getElementById('pendingReports').textContent = pending;
          document.getElementById('resolvedReports').textContent = resolved;
        }
      }
    });

    // Admin login
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const password = document.getElementById('adminPassword').value;
      const errorDiv = document.getElementById('authError');

      if (password === ADMIN_PASSWORD) {
        document.getElementById('adminLoginSection').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        loadAllReports();
      } else {
        errorDiv.textContent = 'كلمة المرور غير صحيحة';
        errorDiv.style.display = 'block';
        setTimeout(() => {
          errorDiv.style.display = 'none';
        }, 3000);
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', function() {
      document.getElementById('adminLoginSection').style.display = 'block';
      document.getElementById('adminDashboard').style.display = 'none';
      document.getElementById('adminPassword').value = '';
    });
  </script>
</body>
</html>
